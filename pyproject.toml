[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stemsplit"
version = "0.1.0"
description = "GPU stem splitter for a folder of songs (Demucs two-pass + optional ensemble)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "demucs>=4.0.1",
    "numpy",
    "psycopg[binary]>=3.2",
    "pyyaml",
    "torch",
    "torchaudio",
    "yt-dlp",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
stemsplit = "stemsplit.cli:main"
stemsplit-download = "stemsplit.download:main"
stemsplit-youtube = "stemsplit.youtube_job:main"

[tool.setuptools.packages.find]
include = ["stemsplit*"]

[tool.setuptools.package-data]
stemsplit = ["catalog.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
