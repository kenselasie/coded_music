[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stemsplit"
version = "0.1.0"
description = "GPU stem splitter for a folder of songs (Demucs two-pass + optional ensemble)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "demucs>=4.0.1",
    "torch",
    "torchaudio",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
stemsplit = "stemsplit.cli:main"

[tool.setuptools.packages.find]
include = ["stemsplit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
